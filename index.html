        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
        :root {
          --bg: #02060a;
          --panel: #0a121a;
          --panel-2: #101c28;
          --border: #1a2a3a;
          --cyan: #00f5ff;
          --gold: #ffcc00;
          --green: #00ff88;
          --text: #c9d6e3;
          --muted: #5a6d80;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; }
        .app-shell {
          min-height: 100vh;
          background: var(--bg);
          padding-top: var(--safe-area-inset-top);
          padding-bottom: 40px;
        }
        .header {
          border-bottom: 1px solid var(--border);
          padding: 18px 20px 14px;
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          gap: 12px;
          background: linear-gradient(180deg, #0a121a 0%, #02060a 100%);
          position: sticky;
          top: var(--safe-area-inset-top);
          z-index: 10;
        }
        .header h1 {
          font-family: 'Space Grotesk', sans-serif;
          font-size: 15px;
          letter-spacing: 0.12em;
          margin:0;
          color: #e6f0ff;
        }
        .header h1 span { color: var(--cyan); }
        .header .sub { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; margin-top:4px; }
        .status-banner {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 12px;
          border-radius: 6px;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
        }
        .status-ok { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: var(--green); }
        .status-bad { background: rgba(255,60,60,0.12); border: 1px solid rgba(255,60,60,0.35); color: #ff6666; }
        .main {
          display: grid;
          grid-template-columns: 1.1fr 0.9fr;
          gap: 18px;
          max-width: 1280px;
          margin: 0 auto;
          padding: 18px 16px;
        }
        @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
        .panel {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 0 0 1px rgba(0,245,255,0.04) inset, 0 10px 40px rgba(0,0,0,0.5);
        }
        .panel-head {
          padding: 12px 16px;
          font-size: 11px;
          letter-spacing: 0.14em;
          color: var(--muted);
          border-bottom: 1px solid var(--border);
          display:flex; justify-content: space-between; align-items: center;
          background: var(--panel-2);
        }
        .drop-zone {
          margin: 14px;
          border: 1.5px dashed #203040;
          border-radius: 10px;
          padding: 28px 16px;
          text-align: center;
          cursor: pointer;
          transition: all .2s;
          background: radial-gradient(600px 200px at 50% 0%, rgba(0,245,255,0.06), transparent);
        }
        .drop-zone.drag-over {
          border-color: var(--cyan);
          background: rgba(0,245,255,0.08);
          box-shadow: 0 0 30px rgba(0,245,255,0.15) inset;
        }
        .drop-zone .big { font-size: 13px; letter-spacing: 0.08em; color: #d0deeb; }
        .drop-zone .small { font-size: 10px; color: var(--muted); margin-top: 6px; }
        .file-list { padding: 0 14px 14px; max-height: 260px; overflow-y: auto; }
        .file-row {
          display:flex; justify-content: space-between; align-items: center;
          padding: 8px 10px;
          border-bottom: 1px solid rgba(255,255,255,0.04);
          font-size: 11px;
        }
        .file-row:hover { background: rgba(255,255,255,0.02); }
        .file-name { color: #cbd9e8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62%; }
        .file-meta { color: var(--muted); font-size: 10px; }
        .controls { padding: 16px; display:flex; flex-direction: column; gap: 16px; }
        .ctrl-group { display:flex; flex-direction: column; gap: 8px; }
        .ctrl-label { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); }
        .pill-row { display:flex; gap: 8px; flex-wrap: wrap; }
        .pill {
          padding: 7px 14px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: #0c1722;
          color: var(--muted);
          font-size: 11px;
          cursor: pointer;
          transition: .15s;
        }
        .pill.active {
          border-color: var(--cyan);
          color: var(--cyan);
          background: rgba(0,245,255,0.12);
          box-shadow: 0 0 12px rgba(0,245,255,0.18);
        }
        .pill.active.gold { border-color: var(--gold); color: var(--gold); background: rgba(255,204,0,0.1); box-shadow: 0 0 12px rgba(255,204,0,0.15); }
        .input-row { display:flex; gap: 10px; flex-wrap: wrap; }
        .input-row input {
          flex:1 1 120px;
          min-width:0;
          max-width:100%;
          background: #081018;
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 10px 12px;
          color: var(--text);
          font-family: inherit;
          font-size: 12px;
        }
        .input-row input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0,245,255,0.15); }
        .preview-table { border-top: 1px solid var(--border); }
        .preview-row {
          display:grid;
          grid-template-columns: 1fr 22px 1fr;
          gap: 6px;
          align-items: center;
          padding: 9px 16px;
          font-size: 11px;
          border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .preview-row .old { color: #7a8da0; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-row .new { font-weight:700; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
        .arrow { color: var(--muted); text-align:center; }
        .btn-primary {
          background: linear-gradient(180deg, var(--cyan), #00c8d0);
          color: #001016;
          border: none;
          border-radius: 8px;
          padding: 13px 16px;
          font-family: inherit;
          font-weight: 700;
          font-size: 12px;
          letter-spacing: 0.08em;
          cursor: pointer;
          box-shadow: 0 0 20px rgba(0,245,255,0.35);
          transition: .15s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(0,245,255,0.5); }
        .btn-secondary {
          background: #111e2b;
          border: 1px solid var(--border);
          color: var(--text);
          border-radius: 8px;
          padding: 12px 14px;
          font-family: inherit;
          font-size: 11px;
          letter-spacing: 0.06em;
          cursor: pointer;
        }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
        .btn-gold {
          background: linear-gradient(180deg, #ffe066, #ffcc00);
          color: #201800;
          border:none;
        }
        .triangle-wrap {
          display:flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          padding: 14px;
          background: radial-gradient(400px 200px at 50% 0%, rgba(255,204,0,0.06), transparent);
          border-top: 1px solid var(--border);
        }
        .log {
          background: #050a10;
          border-top: 1px solid var(--border);
          padding: 10px 14px;
          font-size: 10px;
          line-height: 1.7;
          color: #6a7d90;
          max-height: 140px;
          overflow-y: auto;
          font-family: 'JetBrains Mono', monospace;
        }
        .help {
          grid-column: 1 / -1;
          margin-top: 6px;
          background: #0a121a;
          border: 1px dashed #1f3144;
          border-radius: 10px;
          padding: 14px 16px;
          font-size: 11px;
          line-height: 1.6;
          color: #7a90a5;
        }
        .help strong { color: var(--gold); }
        .help code { background: #081018; padding: 2px 6px; border-radius: 4px; border:1px solid #1a2a3a; color: var(--cyan); }

          0% { filter: drop-shadow(0 0 2px currentColor); }

          100% { filter: drop-shadow(0 0 2px currentColor); }
        }
