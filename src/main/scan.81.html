  transition-duration: 150ms;

  transition-duration: 150ms;
}
:root {
  --bg: #060806;
  --panel: #101410;
  --panel2: #0b0f0b;
  --line: #223022;
  --ink: #d8e4d8;
  --muted: #7d8f7d;
  --gold: #e0a81c;
  --leben: #4ade80;
  --unleben: #6b7280;
  --mann: #e0a81c;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #060806;
    --panel: #101410;
    --panel2: #0b0f0b;
    --line: #223022;
    --ink: #d8e4d8;
    --muted: #7d8f7d;
    --gold: #e0a81c;
    --leben: #4ade80;
    --unleben: #6b7280;
    --mann: #e0a81c;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* {
  -webkit-tap-highlight-color: transparent;
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.scanpulse {
  animation: blinkdot 0.9s steps(2, end) infinite;
}
@keyframes risein {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.risein {
  animation: risein 0.18s ease-out;
}
.logscroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.logscroll::-webkit-scrollbar-thumb {
  background: #223022;
}
.logscroll::-webkit-scrollbar-track {
  background: transparent;
}
.placeholder\:opacity-50::-moz-placeholder{
  opacity: 0.5;
}
.placeholder\:opacity-50::placeholder{
  opacity: 0.5;
}
.hover\:scale-\[1\.04\]:hover{

}

  .sm\:inline{
    display: inline;
  }
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

    grid-template-columns: 1fr 250px;
  }
}
