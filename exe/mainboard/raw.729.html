:root{
  --bg:#060806;
  --surf:#101410;
  --line:#243022;
  --gold:#e0a81c;
  --cyan:#00ccff;
  --mut:#8a9a7a;
  --leben:#4ade80;
  --unleben:#6b7280;
  --mann:#e0a81c;
  --surface:#060806;
  --on-surface:#e8ecd8;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#060806;
    --on-surface:#e8ecd8
  }
}
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  background:var(--bg);
  color:#e8ecd8;
  font-family:'Space Grotesk',sans-serif
}
.mono{
  font-family:'JetBrains Mono',monospace
}
.app-header{
  position:sticky;
  z-index:5;
  border-bottom:1px solid var(--line);
  background:rgba(6,8,6,.97);
  padding:10px 14px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:center
}
.app-header h1{
  margin:0;
  font-size:14px;
  letter-spacing:.1em
}
.app-header h1 span{
  color:var(--gold)
}
.hud{
  margin-left:auto;
  display:flex;
  gap:12px;
  font-size:11px;
  flex-wrap:wrap
}
.app-main{
  max-width:1720px;
  margin:auto;
  padding:12px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  gap:12px
}
@media(max-width:1050px){
  .app-main{
    grid-template-columns:1fr
  }
}
.panel{
  border:1px solid var(--line);
  background:var(--surf);
  border-radius:6px;
  padding:10px;
  min-width:0
}
.panel h2{
  margin:0 0 8px;
  font-size:11px;
  color:var(--gold);
  letter-spacing:.12em
}
canvas{
  width:100%;
  background:#050805;
  border-radius:4px;
  display:block;
  cursor:crosshair
}
#zoomCanvas{
  aspect-ratio:1
}
button{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  padding:7px 10px;
  border:1px solid var(--line);
  background:#171c16;
  color:#e8ecd8;
  border-radius:3px;
  cursor:pointer
}
button:hover{
  border-color:var(--gold)
}
button.active{
  background:var(--gold);
  color:#000;
  border-color:var(--gold)
}
button.cyan.active{
  background:var(--cyan)
}
.row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
  align-items:center
}
.bar{
  height:8px;
  background:#000;
  border-radius:3px;
  overflow:hidden;
  margin:3px 0 8px;
  display:flex
}
.bar>div{
  height:100%;
  transition:width .2s
}
.stat{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  padding:2px 0
}
.log{
  font:10px/1.45 'JetBrains Mono',monospace;
  color:#b7f0c0;
  background:#000;
  border:1px solid var(--line);
  border-radius:3px;
  height:155px;
  overflow:auto;
  padding:6px;
  white-space:pre-wrap
}
.muted{
  font-size:10px;
  color:var(--mut);
  line-height:1.6
}
input[type=text]{
  min-width:0;
  background:#000;
  border:1px solid var(--line);
  color:#e8ecd8;
  padding:7px;
  border-radius:3px
}
input[type=file]{
  display:none
}
</style>
