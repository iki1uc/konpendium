:root {
  --bg: #0a0a0b;
  --surface: #111113;
  --surface-2: #17171a;
  --surface-3: #1e1e22;
  --line: #2c2c31;
  --line-bright: #45454d;
  --ink: #d7d7dc;
  --ink-dim: #8b8b93;
  --ink-faint: #55555e;
  --accent: #3dff6e;
  --accent-dim: #1d7a38;
  --accent-ink: #06130a;
  --warn: #ffb02e;
  --err: #ff4444;
  --glow: rgba(61, 255, 110, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0b;
    --surface: #111113;
    --surface-2: #17171a;
    --surface-3: #1e1e22;
    --line: #2c2c31;
    --line-bright: #45454d;
    --ink: #d7d7dc;
    --ink-dim: #8b8b93;
    --ink-faint: #55555e;
    --accent: #3dff6e;
    --accent-dim: #1d7a38;
    --accent-ink: #06130a;
    --warn: #ffb02e;
    --err: #ff4444;
    --glow: rgba(61, 255, 110, 0.14);
  }
}
html,
body {
  background: var(--bg);
  color: var(--ink);
}
body {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
/* ---- AUTO.OS 9K keyframes ---- */
@keyframes pumpPulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.06);
  }
}
@keyframes pumpPulseFast {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.14);
  }
}
@keyframes blinkCaret {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
@keyframes flowDash {
  to {
    stroke-dashoffset: -28;
  }
}
@keyframes scanline {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
@keyframes ledBlink {
  0%, 60% {
    opacity: 1;
  }
  61%, 100% {
    opacity: 0.25;
  }
}
@keyframes segFlash {
  0% {
    background: var(--glow);
  }
  100% {
    background: transparent;
  }
}
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.pump-idle {
  animation: pumpPulse 2.6s ease-in-out infinite;
  transform-origin: center;
}
.pump-hot {
  animation: pumpPulseFast 0.45s ease-in-out infinite;
  transform-origin: center;
}
.caret-blink {
  animation: blinkCaret 1s steps(1) infinite;
}
.led-run {
  animation: ledBlink 0.5s steps(1) infinite;
}
.rise-in {
  animation: riseIn 0.25s ease-out both;
}
.seg-flash {
  animation: segFlash 0.9s ease-out both;
}
.pipe-flow {
  stroke-dasharray: 6 8;
  animation: flowDash 0.7s linear infinite;
}
/* thin square scrollbars */
.os-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.os-scroll::-webkit-scrollbar-track {
  background: var(--surface);
}
.os-scroll::-webkit-scrollbar-thumb {
  background: var(--line-bright);
  border: 2px solid var(--surface);
}
.os-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--line-bright) var(--surface);
}
::-moz-selection {
  background: var(--accent);
  color: var(--accent-ink);
}
::selection {
  background: var(--accent);
  color: var(--accent-ink);
}
input, select, textarea, button {
  border-radius: 0 !important;
}

}
