  color: var(--ink-dim);
}
.text-\[var\(--ink-faint\)\] {
  color: var(--ink-faint);
}
.text-\[var\(--rehall\)\] {
  color: var(--rehall);
}
.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-opacity {
  transition-property: opacity;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #0a0a0a;
  --surface: #101210;
  --surface-2: #161816;
  --line: #232823;
  --line-bright: #2f3a30;
  --ink: #d7e0d4;
  --ink-dim: #7d8a7c;
  --ink-faint: #4a554a;
  --echo: #00ff88;
  --hall: #ffaa00;
  --rehall: #ff0044;
  --danger: #ff3355;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0a;
    --surface: #101210;
    --surface-2: #161816;
    --line: #232823;
    --line-bright: #2f3a30;
    --ink: #d7e0d4;
    --ink-dim: #7d8a7c;
    --ink-faint: #4a554a;
    --echo: #00ff88;
    --hall: #ffaa00;
    --rehall: #ff0044;
    --danger: #ff3355;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
}
body {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
@keyframes cellPulse {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.9);
  }
}
@keyframes blinkDot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
}
@keyframes scanline {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
.cell-active-now {
  animation: cellPulse 0.6s ease-in-out infinite;
}
.blink {
  animation: blinkDot 1s steps(2, start) infinite;
}
.crt::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.025) 0px,
    rgba(255, 255, 255, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }
  .sm\:h-16 {
    height: 4rem;
  }
  .sm\:w-16 {
    width: 4rem;
  }
  .sm\:flex-none {
    flex: none;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[1fr_340px\] {
    grid-template-columns: 1fr 340px;
  }
}
